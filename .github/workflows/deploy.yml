name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/modest-einstein-yt7dtj]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA fallback: serving index.html as the 404 page lets
      # deep links such as /about or /dashboard load the app, which then routes.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages' source is still "Deploy from a branch", GitHub also runs its own
      # "pages build and deployment" on every push, publishing the unbuilt source
      # (a blank page). Let it finish first so this build is always deployed last.
      - name: Wait for GitHub's branch deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$pending" = "0" ] && break
            echo "Branch deploy still running, waiting…"
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
