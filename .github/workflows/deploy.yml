name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/modest-einstein-yt7dtj]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright (used to pre-render the pages) supports Ubuntu 24.04; ubuntu-latest has moved past it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Site address
        # canonical URLs, hreflang, sitemap and structured data all use the public address
        run: |
          echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]').github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
      # sitemap.xml and robots.txt are written by the build. Analytics stay off unless the
      # repository variables VITE_GA4_ID / VITE_META_PIXEL_ID are set (Settings > Secrets and variables > Actions > Variables)
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
      # Every public page, in English and Arabic, is rendered to static HTML for search engines and
      # AI crawlers, plus llms.txt and llms-full.txt. 404.html stays the bare app shell, so
      # other paths (e.g. /dashboard) still load the app, which then routes.
      - run: npx playwright install --with-deps chromium
      - run: npm run prerender
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages' source is still "Deploy from a branch", GitHub also runs its own
      # "pages build and deployment" on every push, publishing the unbuilt source
      # (a blank page). Let it finish first so this build is always deployed last.
      - name: Wait for GitHub's branch deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$pending" = "0" ] && break
            echo "Branch deploy still running, waiting…"
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
