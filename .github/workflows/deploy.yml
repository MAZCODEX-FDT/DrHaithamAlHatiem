name: Build and deploy to Bluehost

# Every push builds the site; pushes to main (and manual runs) also upload it to
# the Bluehost hosting of drhaithamelhatiem.com over FTPS.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (an FTP account from Bluehost cPanel)
#   Variables (optional):
#     SITE_URL        public address, default https://drhaithamelhatiem.com
#     FTP_SERVER_DIR  folder on the server, default ./ (an FTP account whose home is public_html)
#     FTP_SECURITY    strict (default) or loose, if the server's certificate name does not match FTP_SERVER
#     VITE_GA4_ID / VITE_META_PIXEL_ID  analytics, off unless set

on:
  push:
    branches: [main, claude/modest-einstein-yt7dtj]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Playwright (used to pre-render the pages) supports Ubuntu 24.04; ubuntu-latest has moved past it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # the site lives at the domain root; canonical URLs, hreflang, sitemap, robots.txt
      # and structured data all use the public address
      BASE_PATH: /
      SITE_URL: ${{ vars.SITE_URL || 'https://drhaithamelhatiem.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # sitemap.xml and robots.txt are written by the build. Analytics stay off unless the
      # repository variables VITE_GA4_ID / VITE_META_PIXEL_ID are set
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
      # Every public page, in English and Arabic, is rendered to static HTML for search engines and
      # AI crawlers, plus llms.txt and llms-full.txt. 404.html stays the bare app shell, which
      # .htaccess serves for other paths (e.g. /dashboard), and the app then routes.
      # The runner image ships Google Chrome; use it rather than downloading a browser and its
      # system packages (that apt step can stall on the runner's mirror). Install only as a fallback.
      - name: Browser for pre-rendering
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run prerender
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: bluehost
      url: ${{ vars.SITE_URL || 'https://drhaithamelhatiem.com' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Check the FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
      # Uploads only what changed since the last deploy (it keeps a small sync-state file on the server)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
